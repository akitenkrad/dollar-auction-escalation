version = 1
revision = 3
requires-python = ">=3.11"

[manifest]
members = [
    "dollar-auction-tools",
    "dollar-auction-workspace",
]

[[package]]
name = "dollar-auction-tools"
version = "0.1.0"
source = { editable = "tools" }

[[package]]
name = "dollar-auction-workspace"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "dollar-auction-tools" },
]

[package.metadata]
requires-dist = [{ name = "dollar-auction-tools", editable = "tools" }]
