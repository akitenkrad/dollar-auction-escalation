[metrics."n_trials"]
meaning = "Number of completed or invalid trials included in the cell aggregate."
unit = "count"
direction = "none"
scope = ["run"]

[metrics."first_end_rate"]
meaning = "Share of trials ending with no more than one accepted bid."
unit = "ratio"
direction = "none"
range = [0.0, 1.0]
scope = ["run"]

[metrics."mean_x1_dev"]
meaning = "Mean signed difference between the observed first bid and the exact first bid."
unit = "bid units"
direction = "none"
scope = ["run"]

[metrics."median_t"]
meaning = "Median number of accepted bids before the trial ended."
unit = "count"
direction = "none"
scope = ["run"]

[metrics."invalid_rate"]
meaning = "Share of trials terminated after a second retryable protocol violation."
unit = "ratio"
direction = "none"
range = [0.0, 1.0]
scope = ["run"]

[metrics."waste_mean"]
meaning = "Mean sum of both players' last bids divided by the prize value."
unit = "ratio"
direction = "none"
scope = ["run"]

[metrics."tokens_in"]
meaning = "Sum of reported prompt-token counts across model calls; calls without a count contribute no tokens."
unit = "tokens"
direction = "none"
scope = ["run"]

[metrics."tokens_out"]
meaning = "Sum of reported completion-token counts across model calls; calls without a count contribute no tokens."
unit = "tokens"
direction = "none"
scope = ["run"]

[metrics."n_calls"]
meaning = "Number of model calls made in the run."
unit = "count"
direction = "none"
scope = ["run"]

[metrics."n_calls_missing_prompt_tokens"]
meaning = "Number of model calls that did not report a prompt-token count."
unit = "count"
direction = "none"
scope = ["run"]

[metrics."quiz_drop_solve_rate"]
meaning = "Share of valid or invalid quiz sessions whose answer matches the drop-on-ties anchor."
unit = "ratio"
direction = "none"
range = [0.0, 1.0]
scope = ["run"]

[metrics."quiz_mixed_solve_rate"]
meaning = "Share of quiz sessions whose answer matches the uniform-mixing-on-ties anchor."
unit = "ratio"
direction = "none"
range = [0.0, 1.0]
scope = ["run"]

[metrics."quiz_invalid_rate"]
meaning = "Share of quiz sessions with an invalid JSON answer."
unit = "ratio"
direction = "none"
range = [0.0, 1.0]
scope = ["run"]

[parameters."/s"]
meaning = "Prize or contract value."
unit = "bid units"

[parameters."/b"]
meaning = "Commonly known bid budget or investment cap for both players."
unit = "bid units"

[parameters."/p1"]
meaning = "Bidder implementation assigned to Player 1."

[parameters."/p2"]
meaning = "Bidder implementation assigned to Player 2."

[parameters."/framing"]
meaning = "Named or disguised presentation of the game."

[parameters."/opponent"]
meaning = "Opponent type announced in the prompt."

[parameters."/paraphrase"]
meaning = "Prompt paraphrase identifier."

[parameters."/calculator"]
meaning = "Whether the bounded integer calculator is available."

[parameters."/display_paid_so_far"]
meaning = "Whether the observation explicitly displays the player's current payment."

[parameters."/root_seed"]
meaning = "Root seed used to derive the trial seed."

[parameters."/trial_seed"]
meaning = "Seed derived from the root, cell index, and trial index."

[parameters."/temperature"]
meaning = "LLM sampling temperature."

[parameters."/think"]
meaning = "Thinking-mode value sent with every LLM request."

[parameters."/command"]
meaning = "CLI subcommand that created the run."

[parameters."/budgets"]
meaning = "Budget or cap values included in a sweep."
unit = "bid units"

[parameters."/trials"]
meaning = "Number of independent trials in each cell."
unit = "count"

[parameters."/max_bids"]
meaning = "Maximum accepted bids before a trial is censored by the turn cap; null means unlimited."
unit = "count"

[parameters."/concurrency"]
meaning = "Maximum number of trials executed concurrently within one pilot cell."
unit = "count"

[parameters."/models"]
meaning = "Ordered model tags and configured digest prefixes."

[parameters."/verified_model_digests"]
meaning = "Full model digests returned by Ollama during sweep preflight."

[parameters."/cells"]
meaning = "Ordered pilot cell definitions."

[parameters."/resume"]
meaning = "Prior sweep parent used for cell-level resume, or null."

[parameters."/cell_key"]
meaning = "Human-readable identity of one pilot cell."

[parameters."/model"]
meaning = "Ollama model tag used in this child run."

[parameters."/model_digest"]
meaning = "Full model digest returned by Ollama before this child run."

[parameters."/model_digest_prefix"]
meaning = "Required model digest prefix from the pilot configuration."

[parameters."/kind"]
meaning = "Main, LLM-versus-solver, or calculator pilot cell kind."

[parameters."/input_run_uids"]
meaning = "Run identifiers used as inputs to an analysis run."

[parameters."/input_path"]
meaning = "Input run path supplied to the local analysis command."
