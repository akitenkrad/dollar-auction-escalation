[project]
name = "dollar-auction-tools"
version = "0.1.0"
description = "Visualization & analysis tools"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.scripts]
dollar-auction-tools = "dollar_auction_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dollar_auction_tools"]
